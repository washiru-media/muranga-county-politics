
name: Extract website ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/embu
          unzip -q embu_supabase_luxury_multicategory.zip -d /tmp/embu
          cp -r /tmp/embu/embu_supabase_luxury/. .

      - name: Remove ZIP
        run: rm -f embu_supabase_luxury_multicategory.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract website ZIP" || echo "No changes"
          git push
          
